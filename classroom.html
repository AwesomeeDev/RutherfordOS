<!DOCTYPE html>
<html>
<head>
  <title>Classroom</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h2>Rutherford Classroom</h2>
</header>

<div class="container">

  <button onclick="createClass()">+ Create Class</button>

  <div id="classes"></div>

</div>

<script>
let db = JSON.parse(localStorage.getItem("rutherfordDB") || "{}");

function createClass() {
  let name = prompt("Class name");
  let id = Date.now();

  db[id] = { name };

  localStorage.setItem("rutherfordDB", JSON.stringify(db));

  load();
}

function load() {
  let c = document.getElementById("classes");
  c.innerHTML = "";

  for (let i in db) {
    let div = document.createElement("div");
    div.className = "card";
    div.innerHTML = "📘 " + db[i].name;
    c.appendChild(div);
  }
}

load();
</script>

</body>
</html>
